<!DOCTYPE html>
<html>
<head>
  <title>CHEAT PIALA88 dengan Matrix</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      color: #00ffcc;
      text-align: center;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1; /* supaya canvas jadi background */
    }
    .box {
      border: 2px solid #00ffcc;
      padding: 20px;
      width: 400px;
      margin: 50px auto;
      background: rgba(0, 0, 0, 0.8);
    }
    input, select, button {
      margin: 10px;
      padding: 10px;
      width: 80%;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    .progress {
      width: 80%;
      background: #333;
      margin: 20px auto;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar {
      height: 20px;
      width: 0%;
      background: #00aaff;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <!-- Background Matrix -->
  <canvas id="matrix"></canvas>

  <!-- Form CHEAT PIALA88 -->
  <div class="box" id="formBox">
    <h2>CHEAT PIALA88</h2>
    <p>AKTIFKAN AKUN GACOR </p>
    <label>Nama ID:</label><br>
    <!-- Input kosong, bisa diketik -->
    <input type="text" placeholder="Masukkan ID"><br>
    <label>Pilih Provider:</label><br>
    <select>
      <option>PRAGMATIC PLAY</option>
      <option>HABANERO</option>
      <option>PG SOFT</option>
    </select><br>
    <label>Fitur Tersedia:</label><br>
    <select>
      <option>AUTO MAXWIN</option>
      <option>FREE SPIN</option>
    </select><br>
    <button onclick="startLoading()">PASANG</button>
  </div>

  <!-- Tampilan loading -->
  <div class="box" id="loadingBox" style="display:none;">
    <h2>CHEAT PIALA88</h2>
    <p>Rungkadkan Semua B.O</p>
    <p>Infiltrasi Database...</p>
    <div class="progress">
      <div class="progress-bar" id="bar"></div>
    </div>
    <p id="percent">0%</p>
  </div>

  <script>
    // Animasi Matrix
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff00";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 33);

    // Progress bar + redirect
    function startLoading() {
      document.getElementById("formBox").style.display = "none";
      document.getElementById("loadingBox").style.display = "block";

      let bar = document.getElementById("bar");
      let percent = document.getElementById("percent");
      let progress = 0;

      let interval = setInterval(() => {
        if(progress >= 100) {
          clearInterval(interval);
          // Redirect ke link setelah selesai
          window.location.href = "https://piala88berkah.com";
        } else {
          progress += 4;
          bar.style.width = progress + "%";
          percent.innerText = progress + "%";
        }
      }, 300);
    }
  </script>
</body>
</html>
