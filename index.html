<!DOCTYPE html>
<html>
<head>
  <title>CHEAT SLOT PIALA88 Hacker Style</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      color: #00ffcc; /* neon cyan */
      text-align: center;
      background: black;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* canvas jadi background */
    }
    .box {
      border: 2px solid #00ffcc;
      padding: 20px;
      width: 400px;
      margin: 50px auto;
      background: black;
      color: #00ffcc;
      /* Glow neon untuk box */
      box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
    }
    .box h2, .box p {
      /* Glow neon untuk teks */
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }
    input, select, button {
      margin: 10px;
      padding: 10px;
      width: 80%;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
      /* Glow neon untuk tombol */
      box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }
    .progress {
      width: 80%;
      background: #333;
      margin: 20px auto;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 0 10px #00ffcc;
    }
    .progress-bar {
      height: 20px;
      width: 0%;
      background: #00aaff;
      transition: width 0.3s;
      /* Glow neon untuk progress bar */
      box-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
    }
  </style>
</head>
<body>
  <!-- Background Hacker Matrix -->
  <canvas id="matrix"></canvas>

  <!-- Form CHEAT SLOT PIALA88 -->
  <div class="box" id="formBox">
    <h2>CHEAT SLOT PIALA88</h2>
    <p>AKTIFKAN AKUN GACOR</p>
    <label>Nama ID:</label><br>
    <input type="text" placeholder="Masukkan ID"><br>
    <label>Pilih Provider:</label><br>
    <select>
      <option>PRAGMATIC PLAY</option>
      <option>HABANERO</option>
      <option>SLOT MANIA</option>
      <option>NLC</option>
      <option>PG SOFT</option>
    </select><br>
    <label>Fitur Tersedia:</label><br>
    <select>
      <option>AUTO MAXWIN</option>
      <option>FREE SPIN</option>
    </select><br>
    <button onclick="startLoading()">PASANG</button>
  </div>

  <!-- Tampilan loading -->
  <div class="box" id="loadingBox" style="display:none;">
    <h2>CHEAT SLOT PIALA88</h2>
    <p>AKTIFKAN AKUN GACOR</p>
    <p>Infiltrasi Database...</p>
    <div class="progress">
      <div class="progress-bar" id="bar"></div>
    </div>
    <p id="percent">0%</p>
  </div>

  <script>
    // Animasi Matrix Hacker Background
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.height = window.innerHeight;
      canvas.width = window.innerWidth;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const letters = "01"; // binary style hacker code
    const fontSize = 16;
    let columns = canvas.width / fontSize;
    const drops = [];

    function initDrops() {
      columns = canvas.width / fontSize;
      drops.length = 0;
      for (let x = 0; x < columns; x++) {
        drops[x] = 1;
      }
    }
    initDrops();

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#00ff00");
      gradient.addColorStop(0.5, "#00ffff");
      gradient.addColorStop(1, "#ff00ff");

      ctx.fillStyle = gradient;
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 33);

    // Progress bar + redirect
    function startLoading() {
      document.getElementById("formBox").style.display = "none";
      document.getElementById("loadingBox").style.display = "block";

      let bar = document.getElementById("bar");
      let percent = document.getElementById("percent");
      let progress = 0;

      let interval = setInterval(() => {
        if(progress >= 100) {
          clearInterval(interval);
          window.location.href = "https://piala88berkah.com/";
        } else {
          progress += 4;
          bar.style.width = progress + "%";
          percent.innerText = progress + "%";
        }
      }, 300);
    }
  </script>
</body>
</html>
